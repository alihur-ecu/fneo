# Prepared only. Does not run until a maintainer enables it after review.
# A disposable password must be supplied as a secret at that time.
# This file does not contain a password.
name: reproduce

on:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
      - run: pip install -r requirements-lock.txt
      - run: make reproduce-clean
        env:
          FNEO_NEO4J_PASSWORD: ${{ secrets.FNEO_NEO4J_PASSWORD }}
