# Disposable reproduction database. Password comes from the environment.
# Project name and port stay off the research instance on port 7687.
name: fneo-public-repro
services:
  neo4j:
    image: neo4j:5.9.0
    environment:
      NEO4J_AUTH: neo4j/${FNEO_NEO4J_PASSWORD:?set FNEO_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
    ports:
      - "127.0.0.1:17689:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30
