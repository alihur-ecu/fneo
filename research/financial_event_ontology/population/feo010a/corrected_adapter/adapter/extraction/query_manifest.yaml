- query_id: Q35_spacy_timex_only_count
  purpose: Count spaCy time candidates that are not time mentions.
  expected_source_labels: [SpacyTimexCandidate]
  expected_relationship_types: []
  parameters: [doc_id]
  expected_row_shape: spacy_timex_only_count
  duplicate_handling: Single aggregate.
  document_scoping_method: doc_id equals the selected document and the node is not a TimexMention.
  read_only_safety_classification: read_only_aggregate
  allow_unscoped: false
  known_limitations: These nodes are not added to the time-mention record set.
