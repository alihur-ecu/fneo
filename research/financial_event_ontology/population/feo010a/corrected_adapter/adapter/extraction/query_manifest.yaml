- query_id: Q37_frame_argument_refers_to
  purpose: Read frame-argument to entity links so a frame argument can be aligned with a canonical entity.
  expected_source_labels: [FrameArgument, Entity]
  expected_relationship_types: [REFERS_TO]
  parameters: [doc_id]
  expected_row_shape: link fields
  duplicate_handling: One row per relationship. A frame argument is not an entity mention.
  document_scoping_method: The frame-argument doc_id equals the selected document.
  read_only_safety_classification: read_only_document
  allow_unscoped: false
  known_limitations: Alignment does not copy the frame argument into the entity-mention inventory.
  cypher: |
    MATCH (a:FrameArgument)-[r:REFERS_TO]->(b:Entity)
    WHERE toString(a.doc_id) = $doc_id
    RETURN a.id AS start_app_id, b.id AS end_app_id, r.source AS source
    ORDER BY a.id, b.id
