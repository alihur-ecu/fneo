# Collective equity-market descriptors from ENT-02 and OR-CLASS equity-market notes.
name: equity_market
source: FEO-005A equity-market requirements; ENT-02 evidence card
aggregate_phrases:
  - stock markets
  - equity markets
  - equity market
  - stock market
bare_market:
  - the market
  - markets
  - market
geographic_names:
  - asia
  - europe
  - america
  - japan
  - worldwide
  - global
